general {
    output_format = "i3bar"
    colors = true
    interval = 5
}

order += "battery 0"
order += "memory"
order += "cpu_usage"
order += "tztime local"

battery 0 {
    format = "BAT %percentage"
    format_down = "No battery"
    path = "/sys/class/power_supply/BAT%d/uevent"
    low_threshold = 15
}

memory {
    format = "MEM %available"
    threshold_degraded = "1G"
    format_degraded = "LOW MEM: %available"
}

cpu_usage {
    format = "CPU %usage"
}

tztime local {
    format = "%d.%m. %H:%M"
}
